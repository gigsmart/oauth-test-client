services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: pg_isready -U oauth
      interval: 1s
      retries: 30
